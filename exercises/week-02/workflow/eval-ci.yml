# Copy this file to .github/workflows/eval-ci.yml at the repository root.
name: week-02-grader

on:
  push:
    paths:
      - "exercises/week-02/**"
      - ".github/workflows/eval-ci.yml"
  pull_request:
    paths:
      - "exercises/week-02/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercises/week-02
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-groups
      - name: Tests
        run: uv run pytest
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src
