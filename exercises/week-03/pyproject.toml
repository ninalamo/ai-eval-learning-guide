[project]
name = "week03-metrics"
version = "0.1.0"
description = "Week 3: pydantic JSONL metrics"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false
